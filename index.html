<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brenztalbagger</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    img {
      max-width: 100%;
      max-height: 75vh;
      height: auto;
      object-fit: contain;
    }

    footer {
      text-align: center;
      padding: 12px;
      background: rgba(0,0,0,0.85);
    }

    a {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    /* 🔥 FIXE BUTTONS */
    .btn-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      display: flex;
      z-index: 999;
    }

    .btn {
      flex: 1;
      text-align: center;
      padding: 15px;
      font-weight: bold;
      text-decoration: none;
      color: white;
    }

    .call {
      background: #e53935;
    }

    .whatsapp {
      background: #25D366;
    }

    /* 📱 MOBILE */
    @media (max-width: 600px) {
      img {
        max-height: 65vh;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="image-container">
      <img src="Bild26.png" alt="Brenztalbagger">
    </div>

    <footer>
      <a href="impressum.html">Impressum</a>
    </footer>

  </div>

  <!-- 🔥 FIXE BUTTONS -->
  <div class="btn-bar">
    <a class="btn call" href="tel:+49123456789">📞 Anrufen</a>
    <a class="btn whatsapp" href="https://wa.me/49123456789" target="_blank">💬 WhatsApp</a>
  </div>

</body>
</html>
