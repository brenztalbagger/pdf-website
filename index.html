<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brenztalbagger</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .image-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    img {
      max-width: 100%;
      max-height: 75vh;
      height: auto;
      object-fit: contain;
    }

    footer {
      text-align: center;
      padding: 14px;
      background: rgba(0,0,0,0.85);
    }

    a {
      color: white;
      text-decoration: none;
      font-size: 16px;
    }

    a:hover {
      text-decoration: underline;
    }

    /* 📱 MOBILE OPTIMIERUNG */
    @media (max-width: 600px) {
      img {
        max-height: 65vh;
      }

      footer {
        padding: 18px;
      }

      a {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <div class="image-container">
      <img src="Bild26.png" alt="Brenztalbagger">
    </div>

    <footer>
      <a href="impressum.html">Impressum</a>
    </footer>

  </div>

</body>
</html>
